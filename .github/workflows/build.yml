name: "Build"

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * SAT' # ogni sabato alle 12 -> '0 12 * * SAT'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Download the citations
        env:
          SCHOLARID: ${{ secrets.SCHOLARID }}
          SCOPUSID: ${{ secrets.SCOPUSID }}
          SCOPUSKEY: ${{ secrets.SCOPUSKEY }}
        run: |
          cp config.example.yml config.yml
          sed -i "s/<SCHOLARID>/$SCHOLARID/g" config.yml
          sed -i "s/<SCOPUSID>/$SCOPUSID/g" config.yml
          sed -i "s/<SCOPUSKEY>/$SCOPUSKEY/g" config.yml
          docker compose up
